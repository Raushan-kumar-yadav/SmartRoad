<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SmartRoad Edge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#09090b;color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;overscroll-behavior:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #27272a;background:#09090b;position:sticky;top:0;z-index:10}
  .logo{font-size:15px;font-weight:700;letter-spacing:-.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:#3f3f46;display:inline-block;margin-right:5px;transition:background .3s}
  .dot.live{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.25)}50%{box-shadow:0 0 0 7px rgba(34,197,94,.05)}}
  .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid #27272a;color:#71717a}
  .badge.live{border-color:rgba(34,197,94,.3);color:#22c55e;background:rgba(34,197,94,.08)}
  #preview-wrap{position:relative;width:100%;background:#000;aspect-ratio:16/9;overflow:hidden}
  canvas{width:100%;height:100%;display:block;object-fit:cover}
  video{display:none}
  #no-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#52525b;font-size:13px}
  #no-cam svg{width:40px;height:40px;stroke:#3f3f46}
  .hud{position:absolute;font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.7);font-family:monospace}
  #hud-fps{top:8px;right:8px;color:#a1a1aa}
  #hud-gps{bottom:8px;left:8px;color:#a1a1aa}
  #hud-dets{top:8px;left:8px;color:#22c55e}
  #spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
  #spinner::after{content:'';width:28px;height:28px;border:3px solid #27272a;border-top-color:#22c55e;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .controls{display:flex;gap:8px;padding:12px 14px}
  .btn{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn-start{background:#22c55e;color:#000}
  .btn-start:active{background:#16a34a;transform:scale(.97)}
  .btn-stop{background:#27272a;color:#fafafa;border:1px solid #3f3f46}
  .btn-stop:active{background:#18181b;transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-flip{background:#18181b;border:1px solid #27272a;color:#a1a1aa;flex:0 0 48px;padding:0;font-size:20px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#27272a;border-top:1px solid #27272a;border-bottom:1px solid #27272a}
  .stat{background:#09090b;padding:10px 12px}
  .stat-label{font-size:9px;color:#52525b;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .stat-value{font-size:16px;font-weight:700;margin-top:2px;font-family:monospace}
  .stat-value.g{color:#22c55e}
  .detections{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
  .det-hdr{font-size:10px;color:#52525b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .det-item{display:flex;align-items:center;justify-content:space-between;background:#18181b;border:1px solid #27272a;border-radius:8px;padding:9px 11px;animation:fadein .2s}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .det-name{font-size:13px;font-weight:600}
  .det-right{display:flex;align-items:center;gap:8px}
  .det-conf{font-size:12px;font-family:monospace;font-weight:600}
  .det-upload{font-size:10px;padding:2px 7px;border-radius:999px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#22c55e;cursor:pointer;user-select:none}
  .empty{color:#3f3f46;font-size:13px;text-align:center;padding:16px}
  .conf-hi{color:#22c55e}.conf-med{color:#f59e0b}.conf-lo{color:#ef4444}
  .footer{padding:10px 14px;font-size:10px;color:#3f3f46;border-top:1px solid #18181b;display:flex;justify-content:space-between}
  #upload-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:#22c55e;color:#000;font-size:12px;font-weight:600;padding:8px 18px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;z-index:100}
  #upload-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="logo">&#x1F6E3; SmartRoad Edge</div>
  <div><span class="dot" id="dot"></span><span class="badge" id="badge">Offline</span></div>
</header>
<div id="preview-wrap">
  <canvas id="canvas"></canvas>
  <video id="video" autoplay playsinline muted></video>
  <div id="no-cam">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
    <span id="no-cam-msg">Press Start</span>
  </div>
  <div class="hud" id="hud-dets" style="display:none"></div>
  <div class="hud" id="hud-fps"  style="display:none">-- fps</div>
  <div class="hud" id="hud-gps"  style="display:none">GPS...</div>
  <div id="spinner"></div>
</div>
<div class="controls">
  <button class="btn btn-start" id="btn-start" onclick="startCam()">&#x25B6; Start</button>
  <button class="btn btn-flip" onclick="flipCam()" title="Flip">&#x21C6;</button>
  <button class="btn btn-stop" id="btn-stop" onclick="stopCam()" disabled>&#x25A0; Stop</button>
</div>
<div class="stats">
  <div class="stat"><div class="stat-label">FPS</div><div class="stat-value" id="sv-fps">-</div></div>
  <div class="stat"><div class="stat-label">Dets</div><div class="stat-value g" id="sv-dets">0</div></div>
  <div class="stat"><div class="stat-label">Sent</div><div class="stat-value g" id="sv-sent">0</div></div>
  <div class="stat"><div class="stat-label">Model</div><div class="stat-value" id="sv-model" style="font-size:10px;padding-top:4px">loading...</div></div>
</div>
<div class="detections">
  <div class="det-hdr">Live Detections</div>
  <div id="det-list"><div class="empty">No detections yet</div></div>
</div>
<div class="footer">
  <span id="gps-text">GPS: waiting...</span>
  <span id="server-text">Server: -</span>
</div>
<div id="upload-toast">&#x2714; Uploaded!</div>
<script>
  const ANALYZE_FPS=3,CONF_THRESHOLD=0.35,CAPTURE_W=640,CAPTURE_H=480,JPEG_QUALITY=0.82;
  let stream=null,loopId=null,facing='environment',lastT=0,gpsPos=null,sentCount=0,busy=false,serverUrl='';
  const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),noCam=document.getElementById('no-cam');
  async function refreshInfo(){try{const d=await fetch('/info').then(r=>r.json());if(d.server_url){serverUrl=d.server_url;document.getElementById('server-text').textContent='Server: '+serverUrl;}document.getElementById('sv-model').textContent=d.gui_url?'ready':'loading...';}catch{document.getElementById('sv-model').textContent='offline';}}
  refreshInfo();setInterval(refreshInfo,4000);
  if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{gpsPos={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('gps-text').textContent='GPS: '+gpsPos.lat.toFixed(5)+', '+gpsPos.lon.toFixed(5);document.getElementById('hud-gps').textContent=gpsPos.lat.toFixed(4)+','+gpsPos.lon.toFixed(4);},()=>{document.getElementById('gps-text').textContent='GPS: unavailable';},{enableHighAccuracy:true,maximumAge:5000});
  async function startCam(){document.getElementById('btn-start').disabled=true;document.getElementById('no-cam-msg').textContent='Opening camera...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:CAPTURE_W},height:{ideal:CAPTURE_H}},audio:false});video.srcObject=stream;await video.play();canvas.width=video.videoWidth||CAPTURE_W;canvas.height=video.videoHeight||CAPTURE_H;noCam.style.display='none';['hud-fps','hud-gps','hud-dets'].forEach(id=>document.getElementById(id).style.display='block');document.getElementById('btn-stop').disabled=false;document.getElementById('dot').classList.add('live');document.getElementById('badge').textContent='Live';document.getElementById('badge').classList.add('live');loopId=setInterval(captureAndAnalyze,1000/ANALYZE_FPS);}catch(e){document.getElementById('no-cam-msg').textContent='Camera denied: '+e.message;document.getElementById('btn-start').disabled=false;}}
  function stopCam(){if(loopId){clearInterval(loopId);loopId=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}noCam.style.display='flex';document.getElementById('no-cam-msg').textContent='Stopped';['hud-fps','hud-gps','hud-dets'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById('btn-stop').disabled=true;document.getElementById('btn-start').disabled=false;document.getElementById('dot').classList.remove('live');document.getElementById('badge').textContent='Offline';document.getElementById('badge').classList.remove('live');document.getElementById('sv-fps').textContent='-';}
  async function flipCam(){facing=facing==='environment'?'user':'environment';if(stream){stopCam();await startCam();}}
  async function captureAndAnalyze(){if(busy||!stream||video.readyState<2)return;busy=true;const now=Date.now();const fps=lastT>0?(1000/(now-lastT)).toFixed(1):'-';lastT=now;document.getElementById('hud-fps').textContent=fps+' fps';document.getElementById('sv-fps').textContent=fps;ctx.drawImage(video,0,0,canvas.width,canvas.height);const b64=canvas.toDataURL('image/jpeg',JPEG_QUALITY).split(',')[1];try{document.getElementById('spinner').style.display='flex';const res=await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_b64:b64,conf:CONF_THRESHOLD,lat:gpsPos?.lat??null,lon:gpsPos?.lon??null})});const data=await res.json();if(data.error){busy=false;return;}if(data.annotated_b64){const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,canvas.width,canvas.height);busy=false;};img.src='data:image/jpeg;base64,'+data.annotated_b64;}else{busy=false;}const dets=data.detections||[];document.getElementById('sv-dets').textContent=dets.length;document.getElementById('hud-dets').textContent=dets.length?dets.length+' det':'';renderDetections(dets,b64);}catch(e){busy=false;}finally{document.getElementById('spinner').style.display='none';}}
  function renderDetections(dets,b64){const list=document.getElementById('det-list');if(!dets.length){list.innerHTML='<div class="empty">No detections</div>';return;}window._lastDets=dets;window._lastB64=b64;list.innerHTML=dets.map((d,i)=>{const c=d.confidence;const cls=c>=0.7?'conf-hi':c>=0.5?'conf-med':'conf-lo';return `<div class="det-item"><span class="det-name">&#x1F6A7; ${d.class}</span><div class="det-right"><span class="det-conf ${cls}">${(c*100).toFixed(0)}%</span><span class="det-upload" onclick="uploadDetection(${i})">&#x2B06; Send</span></div></div>`;}).join('');}
  async function uploadDetection(idx){const det=(window._lastDets||[])[idx];if(!det||!serverUrl){showToast('No server');return;}try{await fetch(serverUrl.replace(/\/$/,'')+'/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({class:det.class,confidence:det.confidence,bbox:det.bbox,lat:gpsPos?.lat??null,lon:gpsPos?.lon??null,source:'mobile-cam',image_b64:window._lastB64||null})});sentCount++;document.getElementById('sv-sent').textContent=sentCount;showToast('&#x2714; Uploaded!');}catch{showToast('&#x26A0; Failed');}}
  function showToast(msg){const t=document.getElementById('upload-toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body></html>
